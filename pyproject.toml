[project]
name = "anna"
version = "0.1.0"
description = "Voice-controlled computer-use agent for macOS"
readme = "README.md"
authors = [
    { name = "andevsr", email = "ande.roshan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mlx-whisper>=0.4.3",
    "mss>=10.2.0",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "python-dotenv>=1.2.3",
    "sounddevice>=0.5.6",
    "webrtcvad>=2.0.10",
]

[project.scripts]
anna = "anna.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
